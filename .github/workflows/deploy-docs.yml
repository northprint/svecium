name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
      - docment-and-demo
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'docs-site/pnpm-lock.yaml'

      - name: Install dependencies
        run: |
          cd docs-site
          pnpm install

      - name: Build documentation site
        run: |
          cd docs-site
          pnpm run build:docs
        env:
          PUBLIC_CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI0NDViM2NkNi0xYTE2LTRlZTUtODBlNy02MDY2YzM3MmI5NjAiLCJpZCI6MjU5LCJpYXQiOjE3MzU2NjA5MTV9.E3WBVALA-Y8STGTb3FcRLNW_aNghZy5Tcr-CicdCQDg' }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs-site/build'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4